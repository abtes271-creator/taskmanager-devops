name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager_user -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test
        env:
          DB_HOST: localhost
          DB_NAME: taskmanager
          DB_USER: taskmanager_user
          DB_PASSWORD: changeme

      - name: Build application
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t taskmanager:${{ github.sha }} .

      - name: Verify image was built
        run: docker images taskmanager

