spring.application.name=taskmanager

# --- Database (PostgreSQL) ---
# These read from environment variables first, falling back to local defaults.
# This pattern is important later: it's what lets the SAME jar/image run
# locally, in Docker, and in the cloud without code changes.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tas}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = auto-create/alter tables from entities. Fine for learning; in real
# production you'd switch to Flyway/Liquibase migrations (validate mode).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=${SERVER_PORT:8082}

# --- Actuator (used later in the Monitoring phase) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
