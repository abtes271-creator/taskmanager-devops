apiVersion: v1
kind: Service
metadata:
  name: taskmanager-app
spec:
  type: NodePort   # exposes outside the cluster - fine for local minikube learning;
                    # real cloud clusters typically use "LoadBalancer" instead
  selector:
    app: taskmanager-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # must be in range 30000-32767
